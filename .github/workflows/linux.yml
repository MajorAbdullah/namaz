name: Linux

# Builds and tests the Linux app (the Tauri app in windows/). The Mac app is built on the Mac (see
# AGENTS.md); there is no Mac build here.
on:
  pull_request:
    paths:
      - "windows/**"
      - "Resources/Info.plist"
      - "Resources/Adhan.m4a"
      - "Resources/Adhan.ogg"
      - ".github/workflows/linux.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      # What the Tauri shell links against on Linux.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf libssl-dev file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - run: npm ci

      # The version lives in Resources/Info.plist; the Windows copies must agree.
      - run: npm run check-version

      - run: npm run typecheck

      # The prayer maths against the Mac app's own output, the published timetables and the sun.
      - run: npm test

      # The shell needs the built pages to compile against.
      - run: npm run build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: windows/src-tauri
      - run: cargo test
        working-directory: windows/src-tauri

      - run: npm run tauri build -- --bundles deb,appimage
      - name: Name the packages
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p ../installer
          cp src-tauri/target/release/bundle/deb/*.deb "../installer/Namaz-${version}-linux-amd64.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "../installer/Namaz-${version}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: Namaz-linux-packages
          path: |
            installer/*.deb
            installer/*.AppImage
          if-no-files-found: error
